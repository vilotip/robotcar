<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory "/var/www/html">
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /stream http://127.0.0.1:8080/stream flushpackets=on
    ProxyPassReverse /stream http://127.0.0.1:8080/stream

    ProxyPass /upload_distance http://127.0.0.1:8080/upload_distance
    ProxyPassReverse /upload_distance http://127.0.0.1:8080/upload_distance
</VirtualHost>
