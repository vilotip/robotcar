<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory "/var/www/html">
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /video_feed http://127.0.0.1:8080/video_feed
    ProxyPassReverse /video_feed http://127.0.0.1:8080/video_feed
</VirtualHost>