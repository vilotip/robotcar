<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Vision Live Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 24px;
            color: #00e676;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .video-card {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-feed {
            border: 2px solid #00e676;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            background-color: #000;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #00e676;
        }
    </style>
</head>
<body>

    <h1>ESP32 Camera Live Feed</h1>
    <p>Real-Time Binary Threshold Stream (120x80 Processed)</p>

    <div class="video-card">
        <!-- The img src points to the MJPEG HTTP endpoint generated by Python -->
        <img src="/video_feed" class="video-feed" alt="Live Camera Stream">
        <div class="status">● Stream Active</div>
    </div>

</body>
</html>
